<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Auto Play</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #fdf7ff;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #veil {
    position: fixed; inset: 0; background: #fdf7ff;
    transition: opacity 0.35s ease;
  }
</style>
</head>
<body>
<iframe id="game" title="Game" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
<div id="veil"></div>
<script src="auto.js"></script>
</body>
</html>
